name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push cancels the previous run on the same ref so stacked PR commits
# do not stack billable minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Launcher frontend (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
        working-directory: launcher
      - run: npm test
        working-directory: launcher
      - run: npm run build
        working-directory: launcher

  core:
    name: Launcher core (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      # Tauri's Linux deps are not needed for `cargo check` to type-check,
      # but glib/soup headers are: install the minimal set.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: cargo check
        working-directory: launcher/src-tauri
      # hud.rs tests were already stale against the catalogue defaults (8,8 vs 16,56) before
      # this branch touched Linux; they are not part of this gate until someone owns them.
      - run: cargo test -- --skip hud
        working-directory: launcher/src-tauri

  mod:
    name: Fabric mod (gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
        working-directory: i3/mod
      - uses: actions/upload-artifact@v4
        with:
          name: fullmoon-client-jar
          path: |
            i3/mod/build/libs/fullmoon-client-*.jar
            !i3/mod/build/libs/*-sources.jar

  windows-installer:
    name: Windows clean-install smoke
    # Windows minutes bill 2x. PRs already get Linux typecheck; the tagged
    # Release workflow is what ships an installer. Manual dispatch covers a
    # one-off smoke without waiting for a tag.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the bundled mod
        run: ./gradlew build
        working-directory: i3/mod

      - name: Stage the bundled mod
        shell: pwsh
        run: |
          $jar = @(Get-ChildItem i3/mod/build/libs/fullmoon-client-*.jar |
            Where-Object { $_.Name -notlike '*-sources.jar' })
          If ($jar.Count -ne 1) { throw "expected one mod jar, got $($jar.Count)" }
          Copy-Item $jar[0].FullName `
            launcher/src-tauri/resources/mods/fullmoon-client.jar -Force

      - name: Install launcher dependencies
        run: npm ci
        working-directory: launcher

      - name: Bundle the installer
        run: npm run bundle -- --bundles nsis
        working-directory: launcher

      - name: Smoke-test a clean Windows install
        shell: pwsh
        run: ./.github/scripts/windows-smoke.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: fullmoon-windows-smoke
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            windows-smoke-result.json

  linux-bundle:
    name: Linux AppImage + deb + rpm smoke
    # Same rule as the Windows job: PRs get the cheap Linux typecheck; a bundle is
    # built by the tagged Release workflow or on demand here.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Tauri v2's Linux prerequisites, plus the tools the smoke test drives.
      # ubuntu-22.04 on purpose: an AppImage links the build host's glibc, so the
      # oldest supported runner is the one that runs on the most distros.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf file wget \
            xvfb xdotool x11-utils imagemagick dbus-x11 rpm \
            fonts-noto-cjk

      - name: Build the bundled mod
        run: ./gradlew build
        working-directory: i3/mod

      - name: Stage the bundled mod
        run: |
          shopt -s extglob
          jars=(i3/mod/build/libs/fullmoon-client-!(*-sources).jar)
          [ "${#jars[@]}" -eq 1 ] || { echo "expected one mod jar, got ${#jars[@]}"; exit 1; }
          cp "${jars[0]}" launcher/src-tauri/resources/mods/fullmoon-client.jar

      - name: Install launcher dependencies
        run: npm ci
        working-directory: launcher

      - name: Bundle the AppImage and deb
        run: npm run bundle -- --bundles appimage,deb,rpm
        working-directory: launcher

      - name: Let the AppImage use the host graphics stack
        run: ./.github/scripts/appimage-host-libs.sh

      - name: Smoke-test the AppImage under Xvfb
        run: ./.github/scripts/linux-smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullmoon-linux
          path: |
            launcher/src-tauri/target/release/bundle/appimage/*.AppImage
            launcher/src-tauri/target/release/bundle/deb/*.deb
            launcher/src-tauri/target/release/bundle/rpm/*.rpm
            linux-smoke.png
            linux-smoke-result.txt
            launcher.log
            x-tree.txt
            appimage-removed-libs.txt
          if-no-files-found: warn
