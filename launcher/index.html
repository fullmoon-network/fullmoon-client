<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>%BRAND_NAME%</title>
    <!-- the generated tokens load before anything paints, so the boot mark below needs no colour of its own -->
    <link rel="stylesheet" href="/src/design/tokens.css" />
    <style>
      html, body { margin: 0; background: var(--color-surface-void); }
      #root { min-height: 100vh; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: var(--color-surface-void);
      }
      #boot .mark { width: 16px; height: 16px; background: var(--color-brand-seal); }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="mark"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
