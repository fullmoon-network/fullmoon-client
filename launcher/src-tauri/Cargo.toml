[package]
name = "pinion"
version = "1.1.0"
description = "Pinion — custom Minecraft Java client launcher"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "fullmoon"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v3", "v4", "md5", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
# GlobalMemoryStatusEx — the memory slider has to know what the box actually has
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[features]
# keeps `cargo build` honest about tauri's custom-protocol split
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
